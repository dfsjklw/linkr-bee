# ESP32-C5 DevKitC, internal SRAM only -- regression variant.
#
# The board default now enables the module's 8 MB PSRAM and moves data-only
# buffers into it (src/ext_ram.h); this fragment turns all of that back off so
# the pure-SRAM image keeps being built and tested. Use it explicitly:
#
#   west build -b esp32c5_devkitc/esp32c5/hpcore -d build/c5-sram . \
#       -- -DEXTRA_CONF_FILE=c5_pure_sram.conf
#
# The image has to stay below DRAM_SHARED_BUFFERS_END (0x4085C610): the
# 12.8 KB above it is the ROM stack/bss used by the WiFi/PHY code, and
# borrowing it makes WiFi association hang or locks the chip up. Without PSRAM
# to hold them, the buffers therefore come back to DRAM and the sizes that fit
# in that budget are restored here. They are the only differences from the
# PSRAM default.

CONFIG_ESP_SPIRAM=n
# Same choice as the PSRAM build: the WiFi adapter heap must not live in
# external RAM. Stated explicitly so this fragment stands on its own.
CONFIG_ESP_WIFI_HEAP_SYSTEM=y

# Buffers that live in .ext_ram.bss on the default build.
CONFIG_LINKR_BLE_BRIDGE_PEER_TX_QUEUE_DEPTH=4
CONFIG_LINKR_BLE_BRIDGE_WS_BRIDGE_CLIENT_BUFFER_SIZE=1024
CONFIG_LINKR_BLE_BRIDGE_LOG_RING_SIZE=1024
CONFIG_LINKR_BLE_BRIDGE_WEBDAV_UPLOAD_CHUNK=1024
CONFIG_LINKR_BLE_BRIDGE_UART_RX_BUFFER_SIZE=1024
