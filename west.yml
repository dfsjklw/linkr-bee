manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.4.1
      import:
        name-allowlist:
          - hal_espressif
          # LVGL for the ESP32-C5-Touch-LCD-2.8 panel (Waveshare branch).
          # Only built when CONFIG_LVGL is enabled, so the C3/ESP32 targets
          # are unaffected by the extra worktree.
          - lvgl
          - mbedtls
          - tf-psa-crypto
          # The ESP32-C5 controller implements its Security Manager crypto with
          # CONFIG_ESP32_BT_LE_CRYPTO_STACK_MBEDTLS, which Zephyr satisfies from
          # the legacy mbedTLS modules vendored by hostap
          # (modules/mbedtls/legacy_support.cmake). Without this module the C5
          # build fails to configure and pairing cannot be enabled at all.
          - hostap

  self:
    path: linkr-bee
