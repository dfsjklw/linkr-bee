# Waveshare ESP32-C5-Touch-LCD-2.8 board additions.
#
# This file is NOT auto-loaded (the board is still esp32c5_devkitc/esp32c5/
# hpcore). Build with:
#
#   west build -b esp32c5_devkitc/esp32c5/hpcore -d build/c5-waveshare . \
#     -- -DEXTRA_CONF_FILE=boards/linkr_c5_touch_lcd.conf \
#        -DEXTRA_DTC_OVERLAY_FILE=boards/linkr_c5_touch_lcd.overlay
#
# Extra conf files are applied after the board-specific conf, so everything
# below overrides boards/esp32c5_devkitc_esp32c5_hpcore.conf while keeping its
# BLE/WiFi/WebDAV tuning.

# --- Flash ---------------------------------------------------------------
# The module carries 32 MB of flash, but the pinned C5 devicetree includes
# partitions_0x2000_default_8M.dtsi and the linker sizes the XIP segments from
# the flash0 reg property. Keep both at 8 MB until a custom board definition
# (own dts + 32 MB partition table) replaces the devkit one; declaring 2 MB
# (the Zephyr default) makes esptool and the partition table disagree.
CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y

# --- PSRAM (8 MB QSPI on the ESP32-C5-WROOM-1 module) --------------------
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_QUAD=y
CONFIG_SPIRAM_SPEED_80M=y
# The C5 linker script asserts
#   (_ext_ram_end - _ext_ram_start) <= CONFIG_ESP_SPIRAM_SIZE
# where the .ext_ram region also carries ~1 MB of XIP placeholder, so the
# static PSRAM sections plus this heap must fit in the remaining ~7 MB.
CONFIG_ESP_SPIRAM_HEAP_SIZE=4194304
# Skip the boot-time memory test: it costs ~100 ms per MB.
CONFIG_ESP_SPIRAM_MEMTEST=n

# --- Buses and display ---------------------------------------------------
CONFIG_SPI=y
# Polling mode moves ~1 MB/s even with an 80 MHz clock; interrupt mode lets
# the driver refill the 64-byte FIFO from the ISR instead of busy-waiting.
CONFIG_SPI_ESP32_INTERRUPT=y
CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y
# CST3530 touch is polled from the LVGL pointer read callback
# (src/linkr_touch.c), mirroring the vendor example, so the Zephyr input
# subsystem and its automatic pointer indev are not used.
CONFIG_LV_Z_POINTER_INPUT=n

# Board sensors and RTC (SHTC3, QMI8658A, PCF85063A) are no longer shown on the
# panel: the status page is dedicated to bridge state. Keep the drivers off to
# save SRAM/flash until something actually consumes them.
# CONFIG_SENSOR=y
# CONFIG_RTC=y

# --- Linkr panel glue (CH32V003 expander + backlight) --------------------
CONFIG_LINKR_LCD=y
CONFIG_LINKR_LCD_BACKLIGHT_DEFAULT=200

# --- BLE pairing authorization -------------------------------------------
# GPIO1 carries the touch I2C SCL on this board, so the pairing gate is the
# on-screen PAIR button: tapping it opens a 60 s, single-use window.
CONFIG_LINKR_BLE_PAIRING_AUTH_TOUCH=y
CONFIG_LINKR_BLE_PAIRING_WINDOW_MS=60000

# --- LVGL ----------------------------------------------------------------
# Buffers and the LVGL object heap must live in PSRAM: internal SRAM only has
# ~14 KB free. They are placed in a devicetree memory-region (PSRAM_GUI) that
# sits above the shared multi heap, because the C5 linker puts .ext_ram.bss at
# the very start of the mapped PSRAM (0x420E0000) where the heap begins too.
CONFIG_LVGL=y
CONFIG_LV_CONF_SKIP=y
CONFIG_LV_COLOR_DEPTH_16=y
# The ST7789 expects big-endian RGB565 on the wire, while LVGL and the Zephyr
# flush path produce little-endian pixels and CONFIG_ST7789V_RGB565 selects
# PIXEL_FORMAT_RGB_565 (no byte swap in the driver). Without this a dark
# #1082 background reaches the panel as #8210, i.e. magenta.
CONFIG_LV_COLOR_16_SWAP=y

# Rendering buffer geometry is the single biggest performance factor here.
#
# Zephyr renders synchronously (CONFIG_LV_Z_FLUSH_THREAD is off): each VDB
# block is drawn, then display_write() blocks until the SPI transfer finishes.
# Double buffering therefore buys nothing and only costs SRAM, so it is off.
#
# The buffer must live in *internal SRAM*, not PSRAM. Measured on hardware:
# with the VDB in PSRAM a full 240x320 redraw took 574 ms of pure render time
# (~7.5 us/pixel), because LVGL writes pixels one at a time and every cache
# line becomes a read-modify-write against QSPI PSRAM. The vendor reference
# project keeps its 240x20 draw buffer in internal RAM for the same reason.
#
# 3% of 240x320 = 2304 pixels = 4608 bytes. 99.99% SRAM utilisation broke BLE
# pairing ("CMAC operation init failed"), so leave real headroom. 9 scanlines
# per block puts a full frame at 36 flushes; total SPI time is unchanged, only
# the granularity, and what matters is that each block is drawn from SRAM.
CONFIG_LV_Z_VDB_SIZE=3
CONFIG_LV_Z_DOUBLE_VDB=n
CONFIG_LV_Z_VDB_ALIGN=4
# The LVGL *object heap* stays in PSRAM (128 KB does not fit in SRAM); only
# the VDB moves back to .bss.
CONFIG_LV_Z_MEMORY_POOL_CUSTOM_SECTION=y

# Style lookup is the hottest path during a full-screen redraw: every widget
# with local styles (we set text color/font on each of the 48 terminal lines)
# walks a linked list per property. The vendor reference project enables this.
CONFIG_LV_OBJ_STYLE_CACHE=y

# 15 ms = 66.7 Hz, matching the vendor reference project
# (CONFIG_LV_DEF_REFR_PERIOD=15 in 14_wireless_serial_webserver). The stock
# 33 ms caps the render scheduler at 30 Hz and, because Zephyr polls the LVGL
# timer from a workqueue driven by the same value, also halves the touch
# pointer sample rate to 30 Hz — which is what made dragging feel sticky.
CONFIG_LV_DEF_REFR_PERIOD=15

CONFIG_LV_Z_MEM_POOL_SYS_HEAP=y
CONFIG_LV_Z_MEM_POOL_SIZE=131072
CONFIG_LV_Z_MEMORY_POOL_CUSTOM_SECTION=y

# Zephyr drives lv_timer_handler() from a dedicated workqueue so the
# application does not have to own the LVGL main loop.
CONFIG_LV_Z_RUN_LVGL_ON_WORKQUEUE=y
# 8 KB, not 4 KB: the two-page layout nests screen -> tileview -> tile ->
# terminal container -> label, and lv_obj_redraw() recurses once per level
# while looking up inherited styles. 4 KB overflowed on the first frame.
CONFIG_LV_Z_LVGL_WORKQUEUE_STACK_SIZE=8192
CONFIG_LV_Z_AUTO_INIT=y

# Labels use a generated Consolas 14 face (see src/linkr_ui.c for the
# lv_font_conv command). Montserrat 14 stays enabled because it is LVGL's
# default font for widgets that do not set one explicitly.
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_14=y
