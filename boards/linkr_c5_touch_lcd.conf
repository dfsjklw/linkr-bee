# Waveshare ESP32-C5-Touch-LCD-2.8 board additions.
#
# This file is NOT auto-loaded (the board is still esp32c5_devkitc/esp32c5/
# hpcore). Build with:
#
#   west build -b esp32c5_devkitc/esp32c5/hpcore -d build/c5-waveshare . \
#     -- -DEXTRA_CONF_FILE=boards/linkr_c5_touch_lcd.conf \
#        -DEXTRA_DTC_OVERLAY_FILE=boards/linkr_c5_touch_lcd.overlay
#
# Extra conf files are applied after the board-specific conf, so everything
# below overrides boards/esp32c5_devkitc_esp32c5_hpcore.conf while keeping its
# BLE/WiFi/WebDAV tuning.

# --- Flash ---------------------------------------------------------------
# The module carries 32 MB of flash, but the pinned C5 devicetree includes
# partitions_0x2000_default_8M.dtsi and the linker sizes the XIP segments from
# the flash0 reg property. Keep both at 8 MB until a custom board definition
# (own dts + 32 MB partition table) replaces the devkit one; declaring 2 MB
# (the Zephyr default) makes esptool and the partition table disagree.
CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y

# --- PSRAM (8 MB QSPI on the ESP32-C5-WROOM-1 module) --------------------
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_QUAD=y
CONFIG_SPIRAM_SPEED_80M=y
# The C5 linker script asserts
#   (_ext_ram_end - _ext_ram_start) <= CONFIG_ESP_SPIRAM_SIZE
# where the .ext_ram region also carries an XIP placeholder sized by the image,
# so the static PSRAM sections (.ext_ram.bss, the LVGL object heap) plus this
# heap must fit in what remains of the 8 MB.
CONFIG_ESP_SPIRAM_HEAP_SIZE=4194304
# Skip the boot-time memory test: it costs ~100 ms per MB.
CONFIG_ESP_SPIRAM_MEMTEST=n

# --- Buses and display ---------------------------------------------------
CONFIG_SPI=y
# Polling mode moves ~1 MB/s even with an 80 MHz clock; interrupt mode lets
# the driver refill the 64-byte FIFO from the ISR instead of busy-waiting.
CONFIG_SPI_ESP32_INTERRUPT=y
CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y
# CST3530 touch is polled from the LVGL pointer read callback
# (src/linkr_touch.c), mirroring the vendor example, so the Zephyr input
# subsystem and its automatic pointer indev are not used.
CONFIG_LV_Z_POINTER_INPUT=n

# Board sensors and RTC (SHTC3, QMI8658A, PCF85063A) are no longer shown on the
# panel: the status page is dedicated to bridge state. Keep the drivers off to
# save SRAM/flash until something actually consumes them.
# CONFIG_SENSOR=y
# CONFIG_RTC=y

# --- Linkr panel glue (CH32V003 expander + backlight) --------------------
CONFIG_LINKR_LCD=y
CONFIG_LINKR_LCD_BACKLIGHT_DEFAULT=200

# --- BLE pairing authorization -------------------------------------------
# GPIO1 carries the touch I2C SCL on this board, so the pairing gate is the
# on-screen PAIR button: tapping it opens a 60 s, single-use window.
#
# The GPIO gate is switched off explicitly, not inherited: the shared C5
# board conf sets CONFIG_LINKR_BLE_BRIDGE_PAIRING_GPIO_AUTH=y for production,
# which would sample the I2C clock as an authorization key on this board.
CONFIG_LINKR_BLE_BRIDGE_PAIRING_GPIO_AUTH=n
CONFIG_LINKR_BLE_PAIRING_AUTH_TOUCH=y
CONFIG_LINKR_BLE_PAIRING_WINDOW_MS=60000

# --- LVGL ----------------------------------------------------------------
# The LVGL object heap lives in PSRAM (internal SRAM has nothing to spare).
# No linker fragment is needed: the ESP32-C5 script already keeps
# KEEP(*(.lvgl_heap*)) inside .ext_ram.data, before the shared multi heap, so
# this option alone decides the placement. Application-side PSRAM data uses
# the same window through LINKR_EXT_RAM_BSS (src/ext_ram.h).
CONFIG_LVGL=y
CONFIG_LV_CONF_SKIP=y
CONFIG_LV_COLOR_DEPTH_16=y
# The ST7789 expects big-endian RGB565 on the wire, while LVGL and the Zephyr
# flush path produce little-endian pixels and CONFIG_ST7789V_RGB565 selects
# PIXEL_FORMAT_RGB_565 (no byte swap in the driver). Without this a dark
# #1082 background reaches the panel as #8210, i.e. magenta.
CONFIG_LV_COLOR_16_SWAP=y

# Rendering buffer geometry is the single biggest performance factor here.
#
# Zephyr renders synchronously (CONFIG_LV_Z_FLUSH_THREAD is off): each VDB
# block is drawn, then display_write() blocks until the SPI transfer finishes.
# Double buffering therefore buys nothing and only costs SRAM, so it is off.
#
# The buffer must live in *internal SRAM*, not PSRAM. Measured on hardware:
# with the VDB in PSRAM a full 240x320 redraw took 574 ms of pure render time
# (~7.5 us/pixel), because LVGL writes pixels one at a time and every cache
# line becomes a read-modify-write against QSPI PSRAM. The vendor reference
# project keeps its 240x20 draw buffer in internal RAM for the same reason.
#
# 3% of 240x320 = 2304 pixels = 4608 bytes. 99.99% SRAM utilisation broke BLE
# pairing ("CMAC operation init failed"), so leave real headroom. 9 scanlines
# per block puts a full frame at 36 flushes; total SPI time is unchanged, only
# the granularity, and what matters is that each block is drawn from SRAM.
CONFIG_LV_Z_VDB_SIZE=3
CONFIG_LV_Z_DOUBLE_VDB=n
CONFIG_LV_Z_VDB_ALIGN=4
# The LVGL *object heap* stays in PSRAM (128 KB does not fit in SRAM); only
# the VDB moves back to .bss.
CONFIG_LV_Z_MEMORY_POOL_CUSTOM_SECTION=y

# Style lookup is the hottest path during a full-screen redraw: every widget
# with local styles (we set text color/font on each of the 48 terminal lines)
# walks a linked list per property. The vendor reference project enables this.
CONFIG_LV_OBJ_STYLE_CACHE=y

# 15 ms = 66.7 Hz, matching the vendor reference project
# (CONFIG_LV_DEF_REFR_PERIOD=15 in 14_wireless_serial_webserver). The stock
# 33 ms caps the render scheduler at 30 Hz and, because Zephyr polls the LVGL
# timer from a workqueue driven by the same value, also halves the touch
# pointer sample rate to 30 Hz — which is what made dragging feel sticky.
CONFIG_LV_DEF_REFR_PERIOD=15

# LVGL's workqueue must not outrank the radio. It defaults to priority 0,
# which is *above* the ESP32 WiFi threads (0xesp32_wifi0/1 run at
# CONFIG_ESP32_WIFI_MAX_THREAD_PRIORITY=7) and the BT controller task (2).
# Measured on hardware: with the default, the 15 ms LVGL timer starved the
# WiFi supplicant badly enough that association never completed -- a scan
# started and then produced no SCAN_DONE at all, and every connect attempt
# died with auth expire (reason 3) or a bare 30 s timeout. Radar-style
# coexistence cannot schedule the radio while a same-or-higher priority
# renderer keeps taking the CPU. At 10 the panel renders exactly as before
# and WiFi associates on the first try.
CONFIG_LV_Z_LVGL_WORKQUEUE_PRIORITY=10

CONFIG_LV_Z_MEM_POOL_SYS_HEAP=y
CONFIG_LV_Z_MEM_POOL_SIZE=131072

# Zephyr drives lv_timer_handler() from a dedicated workqueue so the
# application does not have to own the LVGL main loop.
CONFIG_LV_Z_RUN_LVGL_ON_WORKQUEUE=y
# 8 KB, not 4 KB: the two-page layout nests screen -> tileview -> tile ->
# terminal container -> label, and lv_obj_redraw() recurses once per level
# while looking up inherited styles. 4 KB overflowed on the first frame.
CONFIG_LV_Z_LVGL_WORKQUEUE_STACK_SIZE=8192
CONFIG_LV_Z_AUTO_INIT=y

# Labels use a generated Consolas 14 face (see src/linkr_ui.c for the
# lv_font_conv command). Montserrat 14 stays enabled because it is LVGL's
# default font for widgets that do not set one explicitly.
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_14=y

# --- Internal SRAM headroom -----------------------------------------------
# sram0 is the scarcest resource on this build: everything LVGL owns lives in
# PSRAM (see above), so what remains in internal RAM is the WiFi/BT system
# heap (~103 KB, see HEAP_MEM_POOL_ADD_SIZE_* in the board conf) plus thread
# stacks. Enabling the upstream watchdog (task_wdt + the ESP32 WDT driver,
# plus the dynamic BLE name) costs ~1.8 KB of that, which is roughly the
# entire margin this build had left, so take it back from two stacks that
# carry no deep call chains:
#   - the ESP timer task only runs expiry callbacks;
#   - the system workqueue here carries short one-shot works (autobaud ticks,
#     watchdog checkpoints, LED and advertising retries), not rendering —
#     LVGL has its own 8 KB workqueue above.
# Deliberately NOT lowered: LVGL (4 KB overflowed, see above), the ESP32 BT
# controller tasks, and main (upstream keeps adding init work to it).
CONFIG_ESP32_TIMER_TASK_STACK_SIZE=3072
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2560

# --- Memory balance after merging main ------------------------------------
# main raised the shared C5 defaults (BLE peer queue depth 4 -> 8, WS client
# ring 1024 -> 2048) for the DevKitC, which has no panel to pay for. This board
# keeps LVGL's VDB and every thread stack in internal SRAM, so the same increase
# overflows sram0_0_seg by ~8 KB. Take it back here rather than in the shared
# file, and trim the LVGL workqueue stack to the size the render loop needs.
CONFIG_LINKR_BLE_BRIDGE_PEER_TX_QUEUE_DEPTH=4
# The WebSocket ring is deliberately *not* cut here: main raised it to 2048 for
# the DevKitC and a 40 KB UART burst still lost ~8.5 KB per client when this
# build used 1024 (measured: ws tx=18839 dropped=8499). 2048 costs 1 KB of the
# ~2.9 KB this image has left and brings the LAN bridge back to lossless.
# CONFIG_LINKR_BLE_BRIDGE_WS_BRIDGE_CLIENT_BUFFER_SIZE stays at main's 2048.
CONFIG_LV_Z_LVGL_WORKQUEUE_STACK_SIZE=4096
# The UART ring is the other buffer that grew upstream-ward; 1024 B still covers
# ~89 ms at 115200 and the panel never drives the console.
CONFIG_LINKR_BLE_BRIDGE_UART_RX_BUFFER_SIZE=1024
CONFIG_ESP32_TIMER_TASK_STACK_SIZE=2560
# One BLE link, not two. main's multi-peer support costs a second peer context,
# a second 2048 B tx thread stack and a second queue; on a board that already
# spends internal SRAM on the panel there is nothing left to pay with, and the
# DevKitC is the multi-client target.
CONFIG_BT_MAX_CONN=1
CONFIG_ESP32_BT_CTLR_LE_MAX_CONN=1
CONFIG_ESP32_BT_CTLR_LE_MAX_ACT=2

# --- SRAM still owed to main's additions ----------------------------------
# After the merge with main the same cuts were not enough: the image overflowed
# sram0_0_seg by ~5 KB, because main grew the management surface (bond labels,
# board AI storage, the X1.0 auxiliary hardware, the console hand-over state)
# while the panel keeps LVGL's draw buffer and render workqueue in internal
# RAM. Take the balance back from the two places that cost SRAM without
# changing what the panel does:
#
#   - two VDB percent instead of three: 3072 B instead of 4608 B. Each flush
#     covers six scanlines instead of nine, so a full frame becomes 54 SPI
#     transactions carrying the same total bytes; the panel still fills a
#     240x320 surface well inside the 15 ms refresh period. Keep the buffer in
#     SRAM -- see the measurement above.
CONFIG_LV_Z_VDB_SIZE=2
#
#   - the network pools. TCP retransmits, so shrinking them costs throughput
#     under a burst, not correctness: the WiFi packet buffers themselves stay
#     in internal RAM and keep their documented placement. The DevKitC build
#     keeps the upstream counts.
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=20
# The system workqueue carries one-shot works only (advertising retries,
# autobaud ticks, the LVGL flush hand-off is on its own workqueue).
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
# The ESP timer task only runs expiry callbacks, and the panel board carries a
# single BLE link, so eight ACL TX buffers are plenty for one encrypted peer.
# (Both are counted with the other board values in docs/WAVESHARE_C5_LCD.md.)
CONFIG_ESP32_TIMER_TASK_STACK_SIZE=2048
CONFIG_BT_BUF_ACL_TX_COUNT=8
