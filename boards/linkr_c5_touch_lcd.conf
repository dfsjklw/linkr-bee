# Waveshare ESP32-C5-Touch-LCD-2.8 board additions.
#
# This file is NOT auto-loaded (the board is still esp32c5_devkitc/esp32c5/
# hpcore). Build with:
#
#   west build -b esp32c5_devkitc/esp32c5/hpcore -d build/c5-waveshare . \
#     -- -DEXTRA_CONF_FILE=boards/linkr_c5_touch_lcd.conf \
#        -DEXTRA_DTC_OVERLAY_FILE=boards/linkr_c5_touch_lcd.overlay
#
# Extra conf files are applied after the board-specific conf, so everything
# below overrides boards/esp32c5_devkitc_esp32c5_hpcore.conf while keeping its
# BLE/WiFi/WebDAV tuning.

# --- Flash ---------------------------------------------------------------
# The module carries 32 MB of flash, but the pinned C5 devicetree includes
# partitions_0x2000_default_8M.dtsi and the linker sizes the XIP segments from
# the flash0 reg property. Keep both at 8 MB until a custom board definition
# (own dts + 32 MB partition table) replaces the devkit one; declaring 2 MB
# (the Zephyr default) makes esptool and the partition table disagree.
CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y

# --- PSRAM (8 MB QSPI on the ESP32-C5-WROOM-1 module) --------------------
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_QUAD=y
CONFIG_SPIRAM_SPEED_80M=y
# The C5 linker script asserts
#   (_ext_ram_end - _ext_ram_start) <= CONFIG_ESP_SPIRAM_SIZE
# where the .ext_ram region also carries an XIP placeholder sized by the image,
# so the static PSRAM sections (.ext_ram.bss, the LVGL object heap) plus this
# heap must fit in what remains of the 8 MB.
CONFIG_ESP_SPIRAM_HEAP_SIZE=4194304
# Skip the boot-time memory test: it costs ~100 ms per MB.
CONFIG_ESP_SPIRAM_MEMTEST=n

# --- Buses and display ---------------------------------------------------
CONFIG_SPI=y
# Polling mode moves ~1 MB/s even with an 80 MHz clock; interrupt mode lets
# the driver refill the 64-byte FIFO from the ISR instead of busy-waiting.
CONFIG_SPI_ESP32_INTERRUPT=y
CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y
# CST3530 touch is polled from the LVGL pointer read callback
# (src/linkr_touch.c), mirroring the vendor example, so the Zephyr input
# subsystem and its automatic pointer indev are not used.
CONFIG_LV_Z_POINTER_INPUT=n

# Board sensors and RTC (SHTC3, QMI8658A, PCF85063A) are no longer shown on the
# panel: the status page is dedicated to bridge state. Keep the drivers off to
# save SRAM/flash until something actually consumes them.
# CONFIG_SENSOR=y
# CONFIG_RTC=y

# --- Linkr panel glue (CH32V003 expander + backlight) --------------------
CONFIG_LINKR_LCD=y
CONFIG_LINKR_LCD_BACKLIGHT_DEFAULT=200
